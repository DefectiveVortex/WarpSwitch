name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and test (downloads + verifies usque and wintun)
        shell: powershell
        run: .\build.ps1 -SkipInstaller
